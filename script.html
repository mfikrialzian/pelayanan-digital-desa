        // FUNGSI KONVERSI URL GOOGLE DRIVE KE DIRECT LINK
        function getDirectDriveImageUrl(originalUrl) {
            if (!originalUrl) return "";
            try {
                var fileIdMatch = originalUrl.match(/\/d\/(.*?)\/view/);
                if (fileIdMatch && fileIdMatch[1]) {
                    return "https://drive.google.com/thumbnail?id=" + fileIdMatch[1] + "&sz=w1000";
                }
            } catch (e) {
                console.error("Gagal mengurai URL gambar Drive:", e);
            }
            return originalUrl;
        }

        function parseQuestionMetadata(rawName) {
            var match = rawName.match(/^{(.*?);;(.*?)}\s*(.*)$/);
            if (match) {
                return {
                    keperluan: match[1] || "Wajib",
                    judul: match[2] || "",
                    cleanName: match[3]
                };
            }
            return { keperluan: "Wajib", judul: "", cleanName: rawName };
        }

        function saveWargaDraft() {
            if (!selectedLayananGlobal) return;
            var draft = {
                layanan: selectedLayananGlobal.nama,
                nik: document.getElementById('warga-nik') ? document.getElementById('warga-nik').value : "",
                nama: document.getElementById('warga-nama') ? document.getElementById('warga-nama').value : "",
                wa: document.getElementById('warga-wa') ? document.getElementById('warga-wa').value : "",
                alamat: document.getElementById('warga-alamat') ? document.getElementById('warga-alamat').value : "",
                keperluan: document.getElementById('warga-keperluan-surat') ? document.getElementById('warga-keperluan-surat').value : "",
                dynamic: {}
            };

            var qFields = document.querySelectorAll('.dynamic-question-field');
            qFields.forEach(function (f) {
                if (f.id) draft.dynamic[f.id] = f.value;
            });
            localStorage.setItem('wargaDraft_Narmada', JSON.stringify(draft));
        }

        function loadWargaDraft(layananNama) {
            var draftStr = localStorage.getItem('wargaDraft_Narmada');
            if (draftStr) {
                try {
                    var draft = JSON.parse(draftStr);
                    if (draft.nik) document.getElementById('warga-nik').value = draft.nik;
                    if (draft.nama) document.getElementById('warga-nama').value = draft.nama;
                    if (draft.wa) document.getElementById('warga-wa').value = draft.wa;
                    if (draft.alamat) document.getElementById('warga-alamat').value = draft.alamat;

                    if (draft.layanan === layananNama) {
                        var kepEl = document.getElementById('warga-keperluan-surat');
                        if (kepEl && draft.keperluan) {
                            kepEl.value = draft.keperluan;
                        }
                        if (draft.dynamic) {
                            Object.keys(draft.dynamic).forEach(function (key) {
                                var el = document.getElementById(key);
                                if (el) el.value = draft.dynamic[key];
                            });
                        }
                        runLiveConditionalLogicEvaluationForCitizen();
                        toggleWizardStep1State();
                    }
                } catch (e) {
                    console.error("Gagal memuat draft:", e);
                }
            }
        }

        window.onload = function () {
            setupInputRestrictions();
            checkServiceStatus();
            loadCMSConfigurationAndLayanan();

            var formWrapper = document.getElementById('wrapper-formulir-pengajuan');
            if (formWrapper) {
                formWrapper.addEventListener('input', function (e) {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
                        saveWargaDraft();
                    }
                });
            }

            var initialPageParam = 'warga';
            var paramEl = document.getElementById('initial-page-param');
            if (paramEl && paramEl.value) {
                initialPageParam = paramEl.value.trim().toLowerCase();
            }
            var urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('page')) {
                initialPageParam = urlParams.get('page').trim().toLowerCase();
            }

            if (initialPageParam === 'admin') {
                if (localStorage.getItem('isAdminLoggedIn_Narmada') === 'true') {
                    switchView('admin');
                } else {
                    switchView('admin');
                    triggerAdminLoginModal();
                }
            } else {
                switchView('beranda');
            }
        };

        function checkServiceStatus() {
            var el = document.getElementById('lbl-desc-jam-pelayanan');
            if (!el) return;
            var now = new Date();
            var day = now.getDay();
            var hour = now.getHours();

            var isBuka = false;
            if (day >= 1 && day <= 5 && hour >= 8 && hour < 14) {
                isBuka = true;
            }

            window.isServiceOpen = isBuka;

            var daysMap = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            var dayName = daysMap[day];

            var timeTxt = (day === 0 || day === 6) ? "Tutup/Libur" : "Jam 08.00 - 14.00";
            var topText = dayName + " " + timeTxt;

            if (isBuka) {
                el.innerHTML = topText + "<br><span class='text-emerald-600 font-semibold mt-1 block text-xs'>Pelayanan Sudah Buka. Silahkan Buat Pengajuan</span>";
            } else {
                el.innerHTML = topText + "<br><span class='text-red-600 font-semibold mt-1 block text-xs'>Maaf Pelayanan Sudah Tutup. Silahkan Kembali Besok</span>";
            }
            el.className = "text-xs font-medium text-slate-600 mt-1";
        }

        function askConfirmation(title, message, onConfirm) {
            var modal = document.getElementById('modal-custom-confirm');
            document.getElementById('confirm-modal-title').innerText = title;
            document.getElementById('confirm-modal-message').innerText = message;
            modal.classList.remove('hidden');

            document.getElementById('confirm-modal-btn-cancel').onclick = function () {
                modal.classList.add('hidden');
            };

            document.getElementById('confirm-modal-btn-ok').onclick = function () {
                modal.classList.add('hidden');
                onConfirm();
            };
        }

        function formatWhatsAppToInternational(val) {
            val = val.replace(/\D/g, '');
            if (val.startsWith('0')) {
                val = '+62' + val.substring(1);
            } else if (val.startsWith('62') && !val.startsWith('+62')) {
                val = '+' + val;
            }
            return val;
        }

        function loadCMSConfigurationAndLayanan() {
            if (isGoogleEnv) {

                    google.script.run
                        .withSuccessHandler(function (res) {

                            applyCMSConfigurations(res);
                            loadLayananDataWarga();
                        })
                        .withFailureHandler(function () {
                            applyCMSConfigurations(dummySetelan);
                            loadLayananDataWarga();
                        })
                        .getAdminSetelan();
                } catch (e) {
                    applyCMSConfigurations(dummySetelan);
                    loadLayananDataWarga();
                }
            } else {
                applyCMSConfigurations(dummySetelan);
                loadLayananDataWarga();
            }

        function applyCMSConfigurations(settings) {
            var titleWarga = document.getElementById('warga-title-view');
            var logoWarga = document.getElementById('warga-logo-img');
            var logoAdmin = document.getElementById('admin-logo-img');

            if (titleWarga) titleWarga.innerText = settings.nama_desa.toUpperCase();

            var defaultLogo = settings.logo_url_desa || dummySetelan.logo_url_desa;
            // Konversi jika itu adalah link Google Drive
            var finalLogo = defaultLogo.indexOf('drive.google.com') !== -1 ? getDirectDriveImageUrl(defaultLogo) : defaultLogo;

            if (logoWarga) logoWarga.src = finalLogo;
            if (logoAdmin) logoAdmin.src = finalLogo;

            var titleAdmin = document.getElementById('admin-title-view');
            if (titleAdmin) titleAdmin.innerText = settings.nama_desa.toUpperCase();

            var bannerName = document.getElementById('banner-desa-name');
            var bannerDesc = document.getElementById('banner-desa-desc');
            if (bannerName) bannerName.innerText = "Desa " + settings.nama_desa;
            if (bannerDesc) bannerDesc.innerText = settings.deskripsi_banner;

            var lblAlur = document.getElementById('lbl-desc-alur-pelayanan');
            var lblSemi = document.getElementById('lbl-desc-semi-digital');

            if (lblAlur) lblAlur.innerText = settings.deskripsi_alur;
            if (lblSemi) lblSemi.innerText = settings.deskripsi_banner_semi;

            var infoJam = document.getElementById('warga-info-jam');
            var infoAlur = document.getElementById('warga-info-alur');
            var infoBannerSemi = document.getElementById('warga-info-banner-semi');

            if (infoJam) {
                if (settings.status_jam_pelayanan === "on") infoJam.classList.remove('hidden');
                else infoJam.classList.add('hidden');
            }
            if (infoAlur) {
                if (settings.status_alur === "on") infoAlur.classList.remove('hidden');
                else infoAlur.classList.add('hidden');
            }
            if (infoBannerSemi) {
                if (settings.status_banner_semi === "on") infoBannerSemi.classList.remove('hidden');
                else infoBannerSemi.classList.add('hidden');
            }

            var bannerImg = document.getElementById('warga-banner-img');
            if (bannerImg) {
                var rawBanner = settings.banner_url_desa || "";
                bannerImg.src = rawBanner.indexOf('drive.google.com') !== -1 ? getDirectDriveImageUrl(rawBanner) : rawBanner;
            }

            var formattedWa = formatWhatsAppToInternational(settings.kontak_wa);
            var waLink = "https://wa.me/" + formattedWa.replace('+', '');
            var elLink = document.getElementById('link-wa-warga-beranda');
            if (elLink) elLink.href = waLink;

            checkServiceStatus();
        }

        function switchView(viewId) {
            if (viewId === 'admin') {
                document.getElementById('citizen-workspace').classList.add('hidden');
                document.getElementById('admin-workspace').classList.remove('hidden');
                activeView = 'admin';
                currentAdminPage = 1;
                fetchAdminStats();
                loadBuilderLayananList();
                loadJenisPelayananAndPersyaratan();
                loadAdminSettingsForm();
            } else {
                var prevView = activeView;
                document.getElementById('admin-workspace').classList.add('hidden');
                document.getElementById('citizen-workspace').classList.remove('hidden');

                document.getElementById('view-beranda').classList.add('hidden');
                document.getElementById('view-layanan').classList.add('hidden');
                document.getElementById('view-status').classList.add('hidden');

                document.getElementById('view-beranda').classList.remove('slide-in-forward', 'slide-in-backward');
                document.getElementById('view-layanan').classList.remove('slide-in-forward', 'slide-in-backward');
                document.getElementById('view-status').classList.remove('slide-in-forward', 'slide-in-backward');

                var targetEl = document.getElementById('view-' + viewId);
                targetEl.classList.remove('hidden');

                if (viewId === 'beranda' && prevView !== 'beranda') {
                    targetEl.classList.add('slide-in-backward');
                } else if (viewId !== 'beranda' && prevView === 'beranda') {
                    targetEl.classList.add('slide-in-forward');
                }

                activeView = viewId;
            }
        }

                pushToast("Maaf, pelayanan saat ini sedang tutup. Silakan kembali pada jam operasional.", "error");

            if (isAdmin && window.isServiceOpen === false) {
                pushToast("Bypass Akses Admin Aktif (Mode Pengecekan).", "info");

        function openLightbox(url, title) {
            var lightbox = document.getElementById('lightbox-modal');
            var img = document.getElementById('lightbox-img');
            var pTitle = document.getElementById('lightbox-title');
            var btnDownload = document.getElementById('lightbox-download');
            
            img.src = url;
            pTitle.innerText = title || 'Berkas';
            btnDownload.href = url;
            
            lightbox.classList.remove('hidden');
            // Sedikit delay agar transisi opacity & scale terlihat smooth
            setTimeout(function() {
                lightbox.classList.remove('opacity-0');
                img.classList.remove('scale-95');
                img.classList.add('scale-100');
            }, 10);
        }

        function closeLightbox() {
            var lightbox = document.getElementById('lightbox-modal');
            var img = document.getElementById('lightbox-img');
            
            lightbox.classList.add('opacity-0');
            img.classList.remove('scale-100');
            img.classList.add('scale-95');
            
            // Tunggu durasi transisi Tailwind (300ms) sebelum di-hidden sepenuhnya
            setTimeout(function() {
                lightbox.classList.add('hidden');
                img.src = '';
            }, 300);
        }

        function closeAdminLoginModal() {
            document.getElementById('modal-login-admin').classList.add('hidden');

        function togglePasswordView(inputId, iconId) {
            var input = document.getElementById(inputId);
            var icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.className = "fa-solid fa-eye-slash";
            } else {
                input.type = "password";
                icon.className = "fa-solid fa-eye";
            }
        }

        function setupInputRestrictions() {
            var nikInput = document.getElementById('warga-nik');
            var waInput = document.getElementById('warga-wa');

            var cleanerFunc = function (e, maxLen) {
                var val = e.target.value.replace(/\D/g, '');
                if (val.length > maxLen) val = val.substring(0, maxLen);
                e.target.value = val;

                if (e.target.id === 'warga-nik') {
                    var warningEl = document.getElementById('lbl-nik-warning');
                    if (val.length > 0 && val.length < 16) {
                        warningEl.classList.remove('hidden');
                    } else {
                        warningEl.classList.add('hidden');
                    }
                }
            };

            if (nikInput) {
                nikInput.oninput = function (e) { cleanerFunc(e, 16); };
            }
            if (waInput) {
                waInput.oninput = function (e) { cleanerFunc(e, 12); };
                waInput.onblur = function (e) {
                    var val = e.target.value.trim();
                    if (val.length >= 10) {
                        e.target.value = formatWhatsAppToInternational(val);
                    }
                };
            }
        }

        function loadLayananDataWarga() {
            var container = document.getElementById('container-list-layanan');
            if (!container) return;
            
            var skeletonHtml = '';
            for (var i = 0; i < 3; i++) {
                skeletonHtml += '<div class="light-glass-card p-4 rounded-2xl animate-pulse bg-white border border-slate-100 flex items-center justify-between">' +
                    '<div class="flex items-center space-x-3">' +
                    '<div class="w-8 h-8 bg-slate-200 rounded-lg"></div>' +
                    '<div class="space-y-2">' +
                    '<div class="h-3 bg-slate-200 rounded w-32"></div>' +
                    '<div class="h-2 bg-slate-200 rounded w-24"></div>' +
                    '</div></div>' +
                    '<div class="w-4 h-4 bg-slate-200 rounded-full"></div>' +
                    '</div>';
            }
            container.innerHTML = skeletonHtml;

            if (isGoogleEnv) {
                try {
                    google.script.run
                        .withSuccessHandler(function (list) { renderLayananListWarga(list); })
                        .getLayananList();
                } catch (e) {
                    renderLayananListWarga(dummyLayananList);
                }
            } else {
                renderLayananListWarga(dummyLayananList);
            }
        }

        function renderLayananListWarga(list) {
            var container = document.getElementById('container-list-layanan');
            if (!container) return;

            if (!list || list.length === 0) {
                container.innerHTML = "<p class='text-xs text-slate-500 italic p-3 text-center'>Belum ada daftar pelayanan dari admin.</p>";
                return;
            }

            window.loadedLayananList = list;

            var htmlBuffer = "";
            list.forEach(function (row) {
                var itemHtml = '<div onclick="openFormPengajuan(\'' + row.nama + '\')" class="light-glass-card p-4 rounded-2xl text-center transition-all duration-300 shadow-lg hover:shadow-2xl cursor-pointer group bg-white border border-slate-101 flex items-center justify-between tap-squish">' +
                    '<div class="flex items-center space-x-3">' +
                    '<span class="text-xl">📄</span>' +
                    '<div class="text-left">' +
                    '<p class="font-extrabold text-xs text-slate-800 group-hover:text-narmadaGreen transition-all">' + row.nama + '</p>' +
                    '<p class="text-[9px] text-slate-400 font-medium">Layanan Digital Terintegrasi</p>' +
                    '</div>' +
                    '</div>' +
                    '<i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-narmadaGreen text-[10px] transition-all"></i>' +
                    '</div>';
                htmlBuffer += itemHtml;
            });
            container.innerHTML = htmlBuffer;
        }

        function openFormPengajuan(nama) {
            var list = window.loadedLayananList || dummyLayananList;
            var found = list.find(l => l.nama === nama);
            if (!found) return;

            selectedLayananGlobal = found;
            document.getElementById('text-judul-layanan-terpilih').innerText = found.nama;

            document.getElementById('lbl-judul-section-isian').innerText = "Isian Keperluan Surat & Formulir";
            document.getElementById('lbl-desc-section-isian').innerText = "Pilih keperluan pengurusan surat Anda dan isi formulir tambahan.";

            uploadDataStore = {};
            currentWizardStep = 1;
            document.getElementById('warga-syarat-checkbox').checked = false;

            var listSyaratDiv = document.getElementById('container-desc-syarat-vertikal');
            listSyaratDiv.innerHTML = "";

            var reqs = found.requirements || [];
            if (reqs.length === 0) {
                listSyaratDiv.innerHTML = '<p class="text-[10px] text-slate-400 italic">Tidak ada persyaratan berkas khusus.</p>';
            } else {
                var groupedReqs = {};
                reqs.forEach(function (req) {
                    var cleanName = req.name;
                    var keperluan = "Wajib";
                    var match = cleanName.match(/^\[(.*?)\]\s*(.*)$/);
                    if (match) {
                        keperluan = match[1];
                        cleanName = match[2];
                    }
                    if (!groupedReqs[keperluan]) groupedReqs[keperluan] = [];
                    if (!groupedReqs[keperluan].includes(cleanName)) {
                        groupedReqs[keperluan].push(cleanName);
                    }
                });

                var htmlBuffer = "";

                if (groupedReqs["Wajib"]) {
                    htmlBuffer += '<div class="mb-2">';
                    htmlBuffer += '<p class="font-bold text-slate-800 text-[10px] mb-1">Dokumen Wajib:</p>';
                    groupedReqs["Wajib"].forEach(function (item) {
                        htmlBuffer += '<div class="flex items-center space-x-1.5 py-0.5 pl-1"><span class="text-narmadaGreen font-extrabold text-[9px]">✔️</span> <span class="text-[10px] text-slate-600 font-semibold">' + item + '</span></div>';
                    });
                    htmlBuffer += '</div>';
                }

                let hasTambahan = Object.keys(groupedReqs).some(k => k !== "Wajib");
                if (hasTambahan) {
                    htmlBuffer += '<p class="font-bold text-slate-800 text-[10px] mb-1 mt-2 border-t border-emerald-200 pt-1">Dokumen Tambahan:</p>';
                }

                Object.keys(groupedReqs).forEach(function (kep) {
                    if (kep !== "Wajib") {
                        htmlBuffer += '<div class="mb-2 border-l-2 border-emerald-300 pl-2 ml-1">';
                        htmlBuffer += '<p class="font-extrabold text-emerald-700 text-[10px] bg-emerald-50 px-2 py-0.5 rounded inline-block mb-1 border border-emerald-100">Jika Keperluan: ' + kep + '</p>';
                        groupedReqs[kep].forEach(function (item) {

        function generateFieldInputHtml(displayType, actualName, requiredAttr, optionsStr) {

                inputHtml += '</select>';
            } else if (displayType === "number") {
                var limitAttr = optionsStr ? ' oninput="if(this.value.length > ' + optionsStr + ') this.value = this.value.slice(0, ' + optionsStr + ');"' : '';
                inputHtml = '<input type="number" ' + requiredAttr + limitAttr + ' placeholder="Ketik angka" class="w-full px-3 py-2.5 rounded-xl custom-input text-sm font-medium shadow-sm dynamic-question-field" data-question="' + actualName + '">';

        function analyzeImageSharpnessLocal(imgElement, callback) {
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            canvas.width = 100;
            canvas.height = 75;
            ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);

            var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            var data = imgData.data;
            var width = imgData.width;
            var height = imgData.height;
            var score = 0;
            var count = 0;

            for (var y = 1; y < height - 1; y += 3) {
                for (var x = 1; x < width - 1; x += 3) {
                    var idx = (y * width + x) * 4;
                    var h = data[idx] - data[idx + 4];
                    var v = data[idx] - data[idx + width * 4];
                    score += (h * h + v * v);
                    count++;
                }
            }
            var avgVariance = Math.sqrt(score / count);
            callback(avgVariance);
        }

        function handleFileSelectImageAndCompress(event, slotId) {
            var file = event.target.files[0];
            if (!file) return;

            pushToast("Membaca & Memproses Gambar...", "info");

            var reader = new FileReader();
            reader.onload = function (e) {
                var img = new Image();
                img.onload = function () {
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');

                    var maxWidth = 1024;
                    var maxHeight = 768;
                    var width = img.width;
                    var height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    var compressedBase64 = canvas.toDataURL("image/jpeg", 0.70);

                    analyzeImageSharpnessLocal(img, function (score) {
                        var pBox = document.getElementById("preview_box_" + slotId);
                        if (!pBox) return;

                        if (score < 9.0) {
                            pushToast("Foto terlalu buram. Silakan gunakan kamera stabil dan pencahayaan terang!", "error");
                            pBox.className = "preview-box rounded-lg p-2 text-center text-red-600 border border-red-500 bg-red-50 flex flex-col items-center justify-center min-h-[60px] text-[9px] font-extrabold";
                            pBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-base mb-0.5 animate-bounce"></i> File Foto Terlalu Buram!';
                            delete uploadDataStore[slotId];
                        } else {
                            uploadDataStore[slotId] = compressedBase64;
                            pBox.className = "preview-box has-image rounded-lg overflow-hidden relative aspect-[4/3] flex items-center justify-center shadow-xl";
                            pBox.innerHTML = '<img id="img_preview_' + slotId + '" src="' + compressedBase64 + '" class="w-full h-full object-cover">' +
                                '<div class="absolute bottom-0 inset-x-0 bg-black/60 text-white text-[8px] py-0.5 font-bold text-center"><i class="fa-solid fa-circle-check text-emerald-400"></i> Berkas Layak (Sharpness: ' + Math.round(score) + ')</div>';
                            pushToast("Foto berhasil dilampirkan.", "success");
                        }
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleWargaSubmit() {
            if (!navigator.onLine) {
                pushToast("Sepertinya koneksi internet Anda terputus. Mohon periksa jaringan Anda sebelum mencoba lagi.", "error");
                return;
            }
            var lastSubmitTime = localStorage.getItem('lastSubmitTime_Narmada');
            if (lastSubmitTime) {
                var timeDiffMinutes = (Date.now() - parseInt(lastSubmitTime)) / (1000 * 60);
                if (timeDiffMinutes < 15) {
                    var timeLeft = Math.ceil(15 - timeDiffMinutes);
                    pushToast("Anti-Spam: Mohon tunggu " + timeLeft + " menit lagi sebelum mengirim pengajuan baru.", "error");

            var nikVal = document.getElementById('warga-nik').value.trim();

            var waVal = document.getElementById('warga-wa').value.trim();
            var alamatVal = document.getElementById('warga-alamat').value.trim();

            var requirements = selectedLayananGlobal.requirements || [];
            var berkasFotoPayload = [];

            for (var i = 0; i < requirements.length; i++) {
                var slotId = "slot_" + requirements[i].id;
                var wrapperCard = document.getElementById('wrapper-slot-card-' + slotId);
                if (wrapperCard && !wrapperCard.classList.contains('hidden') && uploadDataStore[slotId]) {
                    var cleanName = requirements[i].name;
                    var match = cleanName.match(/^\[(.*?)\]\s*(.*)$/);

                    berkasFotoPayload.push({

                    });
                }
            }

            var detailLayananPayload = {};
            var reqKeperluan = document.getElementById('warga-keperluan-surat');
            if (reqKeperluan && reqKeperluan.value) {
                detailLayananPayload["Keperluan Surat"] = reqKeperluan.value.trim();
            }

            var allInputs = document.querySelectorAll('.dynamic-question-wrapper:not(.hidden) .dynamic-question-field');
            var tempPayload = {};
            allInputs.forEach(function(inp) {
                if (inp.value.trim()) {

                    if (!tempPayload[label]) tempPayload[label] = [];

            Object.keys(tempPayload).forEach(function(key) {

                    pushToast("Koneksi gagal: " + e.toString(), "error");

        function runReuploadProcessDirect(event, idPengajuan, labelNamaBerkas) {
            var file = event.target.files[0];
            if (!file) return;

            pushToast("Membaca & Memproses...", "info");

            var reader = new FileReader();
            reader.onload = function (e) {
                var img = new Image();
                img.onload = function () {
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');
                    canvas.width = 1024;
                    canvas.height = 768;
                    ctx.drawImage(img, 0, 0, 1024, 768);
                    var compressedBase64 = canvas.toDataURL("image/jpeg", 0.70);

                    if (isGoogleEnv) {
                        try {
                            google.script.run
                                .withSuccessHandler(function (res) {
                                    if (res.success) {
                                        pushToast(res.message, "success");
                                        runSearchStatus();
                                    } else {
                                        pushToast(res.message, "error");
                                    }
                                })
                                .processReuploadBerkas(idPengajuan, labelNamaBerkas, compressedBase64);
                        } catch (err) { }
                    } else {
                        setTimeout(function () {
                            var findIdx = dummyPengajuanList.findIndex(function (r) { return r.id === idPengajuan; });
                            if (findIdx !== -1) {
                                dummyPengajuanList[findIdx].status = "Pending";
                                dummyPengajuanList[findIdx].catatan = "Berkas '" + labelNamaBerkas + "' sudah diupload ulang. Segera segarkan dashboard.";
                            }
                            pushToast("SIMULASI: Berkas '" + labelNamaBerkas + "' diperbarui.", "success");
                            runSearchStatus();
                        }, 1000);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

                            matchS = (r.status === "Pelayanan Selesai" || r.status === "Selesai");
                        } else {
                            matchS = (r.status === activeStatusFilter);
                        }
                    }
                    return matchK && matchS;
                });

                var total = filtered.length;
                var limit = 10;
                var pages = Math.max(1, Math.ceil(total / limit));
                var paginated = filtered.slice((currentAdminPage - 1) * limit, currentAdminPage * limit);

                setTimeout(function () {
                    renderAdminTable({ data: paginated, totalPages: pages, currentPage: currentAdminPage, totalItems: total });
                }, 400);
            }
        }

            }
            
            var jawabanFormatted = "<div class='space-y-1 pt-1'>";
            
            if (row.detailLayanan && row.detailLayanan !== "-") {
                var matchedLayanan = window.loadedLayananList ? window.loadedLayananList.find(l => l.nama === row.layanan) : null;
                var qMap = {};
                var items = row.detailLayanan.split(" | ");
                
                var submittedKeperluan = "Wajib";
                items.forEach(function(item) {
                    var colon = item.indexOf(":");
                    if (colon > -1) {
                        var q = item.substring(0, colon).trim();
                        var a = item.substring(colon + 1).trim();
                        if (q === "Keperluan Surat") {
                            submittedKeperluan = a;
                        }
                    }
                });

                items.forEach(function(item) {
                    var colon = item.indexOf(":");
                    if (colon > -1) {
                        var q = item.substring(0, colon).trim();
                        var a = item.substring(colon + 1).trim();
                        
                        var keperluan = "Wajib";
                        if (matchedLayanan && matchedLayanan.fields) {
                            var fieldMatches = matchedLayanan.fields.filter(function(f) {
                                return f.label === q || parseQuestionMetadata(f.name).cleanName === q;
                            });
                            
                            if (fieldMatches.length > 0) {
                                var bestMatch = fieldMatches.find(function(f) {
                                    return parseQuestionMetadata(f.name).keperluan === submittedKeperluan;
                                }) || fieldMatches.find(function(f) {
                                    return parseQuestionMetadata(f.name).keperluan === "Wajib";
                                }) || fieldMatches[0];
                                
                                var parsed = parseQuestionMetadata(bestMatch.name);
                                if (parsed.keperluan && parsed.keperluan !== "Wajib") {
                                    keperluan = parsed.keperluan;
                                }
                            }
                        }
                        
                        if (!qMap[keperluan]) qMap[keperluan] = [];
                        qMap[keperluan].push({q: q, a: a});
                    } else {
                        if (!qMap["Wajib"]) qMap["Wajib"] = [];
                        qMap["Wajib"].push({q: item, a: ""});
                    }
                });
                
                Object.keys(qMap).forEach(function(k) {
                    var groupName = k === "Wajib" ? "ISIAN UMUM" : "TAMBAHAN: " + k;
                    jawabanFormatted += "<div class='mb-3'>";
                    jawabanFormatted += "<h6 class='font-bold text-slate-700 mb-1.5 text-[11px] border-b border-slate-200 pb-1'>" + groupName + "</h6>";
                    jawabanFormatted += "<div class='space-y-1 text-[10px] text-slate-700'>";
                    qMap[k].forEach(function(qa) {

                            jawabanFormatted += "<div><span class='inline-block min-w-[120px] font-bold'>- " + qa.q + "</span><span class='font-extrabold text-slate-900'>: " + qa.a + "</span></div>";
                        } else {
                            jawabanFormatted += "<div><span class='font-extrabold text-slate-900'>- " + qa.q + "</span></div>";
                        }
                    });
                    jawabanFormatted += "</div></div>";
                });
            } else {
                jawabanFormatted += "<p class='text-slate-400 italic text-[10px] pt-1'>Tidak ada isian tambahan.</p>";

            jawabanFormatted += "</div>";
            document.getElementById('info-modal-jawaban').innerHTML = jawabanFormatted;

        function calculateAutoVerificationResult(nama, id, layanan) {
            var fileCount = window.activeVerifFiles ? window.activeVerifFiles.length : 0;
            var brokenFiles = [];

            for (var i = 0; i < fileCount; i++) {
                var radios = document.getElementsByName('verif_radio_' + i);
                var chosenVal = "Sesuai";
                for (var j = 0; j < radios.length; j++) {
                    if (radios[j].checked) chosenVal = radios[j].value;
                }

                if (chosenVal === "Tidak Sesuai") {
                    brokenFiles.push(window.activeVerifFiles[i].name);
                }
            }

            var selectStatus = document.getElementById('edit-status-select');
            var textNotes = document.getElementById('edit-status-catatan');

            if (brokenFiles.length > 0) {
                selectStatus.value = "Upload Ulang";
                var filesBullet = brokenFiles.join(", ");
                textNotes.value = "Halo Bapak/Ibu *" + nama + "*, permohonan *" + layanan + "* dengan ID *" + id + "* belum lengkap. " +
                    "Mohon lakukan unggah ulang dokumen berkas berikut: *" + filesBullet + "*, karena foto dokumen yang dikirim buram atau tidak sesuai. " +
                    "Silakan buka menu 'Cek Status' di website resmi kami untuk melakukan upload ulang tanpa harus mengetik ulang nama berkas. Terima kasih.";
            } else {
                selectStatus.value = "Pelayanan Selesai";
                textNotes.value = "Halo Bapak/Ibu *" + nama + "*, berkas pengajuan *" + layanan + "* dengan ID *" + id + "* telah diperiksa dan dinyatakan LENGKAP & SESUAI. " +
                    "Surat pelayanan Anda kini sudah selesai diproses dan siap diserahterimakan di kantor desa. Terima kasih.";
            }
        }

        function loadBuilderDaftarLayananTab() {
            var listContainer = document.getElementById('standalone-active-services-list');
            var totalBadge = document.getElementById('txt-total-layanan-aktif');
            if (!listContainer) return;
            listContainer.innerHTML = getTableSkeleton(5, 5);

            var successHandler = function (list) {
                listContainer.innerHTML = "";
                window.loadedLayananList = list;

                if (totalBadge) totalBadge.innerText = list.length + " Layanan Aktif";

                if (!list || list.length === 0) {
                    listContainer.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400 italic">Belum ada pelayanan aktif terdaftar.</td></tr>';
                    return;
                }

                list.forEach(function (row, index) {
                    var keperluanList = row.judulSectionIsian ? row.judulSectionIsian.split(',').map(s => s.trim()).filter(s => s) : [];

                        ? '<ul class="list-disc pl-3 text-[9px] space-y-0.5 text-slate-600"><li>' + keperluanList.join('</li><li>') + '</li></ul>'
                        : '<span class="text-slate-400 italic text-[9px]">Wajib (Tanpa Pilihan)</span>';

                    var reqMap = {};
                    (row.requirements || []).forEach(function (r) {
                        var cleanName = r.name;
                        var kep = "Wajib";
                        var match = cleanName.match(/^\[(.*?)\]\s*(.*)$/);
                        if (match) { kep = match[1]; cleanName = match[2]; }
                        if (!reqMap[kep]) reqMap[kep] = [];
                        reqMap[kep].push(cleanName);
                    });
                    var docHtml = "";
                    Object.keys(reqMap).forEach(k => {
                        docHtml += '<p class="text-[9px] font-bold text-slate-700 mt-1 mb-0.5">' + (k === "Wajib" ? "DOKUMEN WAJIB" : "TAMBAHAN: " + k) + '</p>';
                        docHtml += '<ul class="list-disc pl-3 text-[9px] space-y-0.5 text-slate-600"><li>' + reqMap[k].join('</li><li>') + '</li></ul>';
                    });
                    if (docHtml === "") docHtml = '<span class="text-slate-400 italic text-[9px]">Tanpa lampiran</span>';

                    var qMap = {};
                    (row.fields || []).forEach(function (f) {
                        var meta = parseQuestionMetadata(f.name);
                        if (!qMap[meta.keperluan]) qMap[meta.keperluan] = [];
                        var typeStr = f.type === 'dropdown' ? ' (Dropdown)' :
                            f.type === 'number' ? ' (Angka)' :
                                f.type === 'date' ? ' (Tanggal)' : ' (Teks)';
                        qMap[meta.keperluan].push(meta.cleanName + typeStr);
                    });
                    var qHtml = "";
                    Object.keys(qMap).forEach(k => {
                        qHtml += '<p class="text-[9px] font-bold text-slate-700 mt-1 mb-0.5">' + (k === "Wajib" ? "ISIAN UMUM" : "TAMBAHAN: " + k) + '</p>';
                        qHtml += '<ul class="list-disc pl-3 text-[9px] space-y-0.5 text-slate-600"><li>' + qMap[k].join('</li><li>') + '</li></ul>';
                    });
                    if (qHtml === "") qHtml = '<span class="text-slate-400 italic text-[9px]">Tanpa pertanyaan</span>';

                    var tr = '<tr class="hover:bg-slate-50 transition-all group">' +
                        '<td class="p-3 text-center text-xs font-bold text-slate-500">' + (index + 1) + '</td>' +
                        '<td class="p-3 font-extrabold text-xs text-slate-800">' + row.nama + '</td>' +
                        '<td class="p-3 align-top">' + kepHtml + '</td>' +
                        '<td class="p-3 align-top">' + docHtml + '</td>' +
                        '<td class="p-3 align-top">' + qHtml + '</td>' +
                        '<td class="p-3 text-center align-middle">' +
                        '<div class="flex items-center justify-center gap-1">' +
                        '<button onclick="switchAdminTab(\'layanan\'); populateBuilderLayananToEdit(\'' + row.id + '\')" class="p-1.5 text-blue-600 hover:bg-white rounded-lg border border-slate-200 shadow-sm transition-all" title="Edit Layanan"><i class="fa-solid fa-edit text-[10px]"></i></button>' +
                        '<button onclick="deleteBuilderMasterLayanan(\'' + row.nama + '\')" class="p-1.5 text-red-600 hover:bg-white rounded-lg border border-slate-200 shadow-sm transition-all" title="Hapus Layanan"><i class="fa-solid fa-trash text-[10px]"></i></button>' +
                        '</div>' +
                        '</td>' +
                        '</tr>';
                    listContainer.innerHTML += tr;
                });
            };

            if (isGoogleEnv) {
                google.script.run.withSuccessHandler(successHandler).getLayananList();
            } else {
                setTimeout(function () { successHandler(dummyLayananList); }, 200);
            }
        }

        function populateBuilderLayananToEdit(id) {
            var list = window.loadedLayananList || dummyLayananList;
            var found = list.find(l => l.id === id);
            if (!found) return;

            document.getElementById('builder-select-layanan').value = found.nama;
            document.getElementById('wrapper-builder-nama').classList.add('hidden');
            document.getElementById('builder-layanan-nama').value = found.nama;

            var selectKeperluan = document.getElementById('builder-keperluan-select');
            selectKeperluan.innerHTML = '<option value="">-- Pilih atau Tambah Keperluan --</option>' +
                '<option value="__ADD_NEW__" class="font-extrabold text-emerald-600">[+] TAMBAH KEPERLUAN BARU...</option>';

            var optionsStr = found.judulSectionIsian || "";
            if (optionsStr) {
                var optionsArray = optionsStr.split(",");
                optionsArray.forEach(function (opt) {
                    var cleanOpt = opt.trim();
                    if (cleanOpt) {
                        var o = document.createElement('option');
                        o.value = cleanOpt;
                        o.text = cleanOpt;
                        selectKeperluan.add(o, selectKeperluan.options[selectKeperluan.options.length - 1]);
                    }
                });
            }

            builderQuestions = [];
            (found.fields || []).forEach(function (f) {
                var displayType = f.type;
                var actualName = f.name;
                var typeMatch = actualName.match(/(.*)\s*\|\|(number|date)\|\|$/);
                if (typeMatch) {
                    displayType = typeMatch[2];
                    actualName = typeMatch[1].trim();
                }

                builderQuestions.push({
                    id: f.id,
                    label: f.label || actualName,
                    name: actualName,
                    type: displayType,
                    options: f.options || "",
                    required: f.required || "ya"
                });
            });

            builderReqMap = {};
            (found.requirements || []).forEach(function (req) {
                var match = req.name.match(/^\[(.*?)\]\s*(.*)$/);
                if (match) {
                    var kep = match[1];
                    var reqName = match[2];
                    if (!builderReqMap[kep]) builderReqMap[kep] = [];
                    builderReqMap[kep].push(reqName);
                } else {
                    if (!builderReqMap["Wajib"]) builderReqMap["Wajib"] = [];
                    builderReqMap["Wajib"].push(req.name);
                }
            });

            renderBuilderQuestionsUIList();
            pushToast("Konfigurasi '" + found.nama + "' berhasil dimuat.", "info");
            switchBuilderStep(1);
        }

        var currentRepeaterGroup = [];
        var editingRepeaterIndex = -1;

        function toggleBuilderOptionInput() {
            var type = document.getElementById('builder-q-type').value;
            var wrapperOpt = document.getElementById('wrapper-q-options');
            var wrapperLim = document.getElementById('wrapper-q-limit');

            wrapperOpt.classList.add('hidden');
            if (wrapperLim) wrapperLim.classList.add('hidden');

            if (type === "dropdown") {
                wrapperOpt.classList.remove('hidden');
            } else if (type === "number" && wrapperLim) {
                wrapperLim.classList.remove('hidden');
            }
        }
        
        function populateBuilderRepeaterSelect() {

        function addQuestionToRepeaterTempList() {
            var sel = document.getElementById('builder-repeater-select');
            var val = sel.value;
            if (val === "") {
                pushToast("Silakan pilih pertanyaan terlebih dahulu!", "error");
                return;
            }
            var idx = parseInt(val);

            if (currentRepeaterGroup.some(item => item.id === q.id)) {

        function renderRepeaterTempList() {
            var container = document.getElementById('builder-repeater-temp-list');
            if (!container) return;
            
            if (currentRepeaterGroup.length === 0) {
                container.innerHTML = '<div class="text-center text-[10px] text-slate-400 italic py-2">Belum ada pertanyaan dipilih.</div>';
                return;
            }
            
            var html = '';
            currentRepeaterGroup.forEach(function(q, i) {
                var meta = parseQuestionMetadata(q.name);
                html += '<div class="flex items-center justify-between p-2 rounded-lg border border-slate-200 bg-slate-50 text-[10px] font-semibold text-slate-700">' +
                    '<div class="flex gap-2 items-center">' +
                        '<span class="text-indigo-500 font-extrabold w-4">' + (i + 1) + '.</span>' +

                    '<div class="flex gap-1">' +

                        '<button type="button" onclick="moveRepeaterTempItem(' + i + ', 1)" class="px-2 py-1 bg-white hover:bg-slate-100 border rounded text-slate-500 shadow-sm"><i class="fa-solid fa-arrow-down"></i></button>' +
                        '<button type="button" onclick="removeRepeaterTempItem(' + i + ')" class="px-2 py-1 bg-red-50 hover:bg-red-100 border border-red-200 rounded text-red-500 ml-2 shadow-sm"><i class="fa-solid fa-trash"></i></button>' +
                    '</div>' +
                '</div>';

        }

        function moveRepeaterTempItem(index, dir) {
            if (dir === -1 && index > 0) {
                var temp = currentRepeaterGroup[index];
                currentRepeaterGroup[index] = currentRepeaterGroup[index - 1];
                currentRepeaterGroup[index - 1] = temp;
                renderRepeaterTempList();
            } else if (dir === 1 && index < currentRepeaterGroup.length - 1) {
                var temp = currentRepeaterGroup[index];
                currentRepeaterGroup[index] = currentRepeaterGroup[index + 1];
                currentRepeaterGroup[index + 1] = temp;
                renderRepeaterTempList();
            }
        }

        function removeRepeaterTempItem(index) {
            currentRepeaterGroup.splice(index, 1);
            renderRepeaterTempList();
        }

        function saveRepeaterGroup() {
            if (currentRepeaterGroup.length === 0) {
                pushToast("Grup masih kosong! Pilih minimal satu pertanyaan.", "error");
                return;
            }
            
            var keperluan = document.getElementById('builder-repeater-keperluan').value || "Wajib";
            
            // Auto generate judul based on first question
            var metaFirst = parseQuestionMetadata(currentRepeaterGroup[0].name);
            var judul = "Grup Berulang: " + metaFirst.cleanName + (currentRepeaterGroup.length > 1 ? " dll" : "");
            
            var formattedName = "{" + keperluan + ";;} " + judul;
            
            var newQuestionObj = {
                id: "FLD-" + Math.random().toString(36).substr(2, 5).toUpperCase(),
                label: formattedName,
                name: formattedName,
                type: "repeater",
                options: JSON.stringify(currentRepeaterGroup),
                required: "ya"
            };
            
            if (editingRepeaterIndex !== -1) {
                newQuestionObj.id = builderQuestions[editingRepeaterIndex].id;
                builderQuestions[editingRepeaterIndex] = newQuestionObj;
                pushToast("Grup pertanyaan berhasil diupdate.", "success");
            } else {
                builderQuestions.push(newQuestionObj);
                pushToast("Grup pertanyaan berhasil ditambahkan.", "success");
            }
            
            builderQuestions.sort(function (a, b) {
                var metaA = parseQuestionMetadata(a.name);
                var metaB = parseQuestionMetadata(b.name);
                if (metaA.keperluan === "Wajib" && metaB.keperluan !== "Wajib") return -1;
                if (metaB.keperluan === "Wajib" && metaA.keperluan !== "Wajib") return 1;
                if (metaA.keperluan < metaB.keperluan) return -1;
                if (metaA.keperluan > metaB.keperluan) return 1;
                
                // Ensure repeater group marker stays AFTER its constituent elements
                if (a.type === "repeater" && b.type !== "repeater") return 1;
                if (b.type === "repeater" && a.type !== "repeater") return -1;
                return 0;
            });
            
            cancelEditRepeaterGroup();
            renderBuilderQuestionsUIList();
        }

        function cancelEditRepeaterGroup() {
            editingRepeaterIndex = -1;
            currentRepeaterGroup = [];
            document.getElementById('builder-repeater-select').value = "";
            renderRepeaterTempList();
            
            var btnAdd = document.getElementById('btn-add-update-repeater');
            btnAdd.innerHTML = '<i class="fa-solid fa-save"></i> <span>Tambahkan Grup</span>';
            btnAdd.className = "px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 shadow-md";
            document.getElementById('btn-cancel-update-repeater').classList.add('hidden');
        }

        function addBuilderQuestionToList() {
            var keperluan = document.getElementById('builder-q-keperluan').value || "Wajib";
            var judul = document.getElementById('builder-q-judul').value.trim();
            var label = document.getElementById('builder-q-label').value.trim();
            var type = document.getElementById('builder-q-type').value;
            var reqStatus = document.getElementById('builder-q-required') ? document.getElementById('builder-q-required').value : "ya";

            var finalOptions = "";
            if (type === "dropdown") {
                finalOptions = document.getElementById('builder-q-options').value.trim();
                if (!finalOptions) { pushToast("Tulis opsi dropdown dipisahkan tanda koma!", "error"); return; }
            } else if (type === "number") {
                var limEl = document.getElementById('builder-q-limit');
                if (limEl) finalOptions = limEl.value.trim();
            }

            if (!label) {
                pushToast("Label pertanyaan wajib ditulis!", "error");
                return;
            }

            var formattedName = "{" + keperluan + ";;" + judul + "} " + label;

            var newQuestionObj = {
                id: "FLD-" + Math.random().toString(36).substr(2, 5).toUpperCase(),
                label: formattedName,
                name: formattedName,
                type: type,
                options: finalOptions,
                required: reqStatus
            };

            if (window.editingQuestionIndex !== -1) {
                newQuestionObj.id = builderQuestions[window.editingQuestionIndex].id; // Pertahankan ID
                builderQuestions[window.editingQuestionIndex] = newQuestionObj;
                cancelEditBuilderQuestion();
                pushToast("Pertanyaan berhasil diupdate.", "success");
            } else {
                builderQuestions.push(newQuestionObj);
                pushToast("Pertanyaan berhasil ditambahkan.", "success");
            }

            // Sort / Urutkan Berdasarkan Keperluan (Wajib selalu teratas)
            builderQuestions.sort(function (a, b) {
                var metaA = parseQuestionMetadata(a.name);
                var metaB = parseQuestionMetadata(b.name);
                if (metaA.keperluan === "Wajib" && metaB.keperluan !== "Wajib") return -1;
                if (metaB.keperluan === "Wajib" && metaA.keperluan !== "Wajib") return 1;
                if (metaA.keperluan < metaB.keperluan) return -1;
                if (metaA.keperluan > metaB.keperluan) return 1;
                return 0;
            });

            document.getElementById('builder-q-label').value = "";
            document.getElementById('builder-q-options').value = "";
            document.getElementById('builder-q-judul').value = "";
            if (document.getElementById('builder-q-limit')) document.getElementById('builder-q-limit').value = "";

            renderBuilderQuestionsUIList();
        }

        function removeBuilderQuestion(index) {
            builderQuestions.splice(index, 1);
            if (window.editingQuestionIndex === index) cancelEditBuilderQuestion();
            renderBuilderQuestionsUIList();
        }

        function moveBuilderQuestionUp(index) {
            var currentQ = builderQuestions[index];
            var currentMeta = parseQuestionMetadata(currentQ.name);
            var prevIndex = -1;
            for (var i = index - 1; i >= 0; i--) {
                var meta = parseQuestionMetadata(builderQuestions[i].name);
                if (meta.keperluan === currentMeta.keperluan) {
                    prevIndex = i;
                    break;
                }
            }
            if (prevIndex !== -1) {
                var temp = builderQuestions[prevIndex];
                builderQuestions[prevIndex] = builderQuestions[index];
                builderQuestions[index] = temp;
                renderBuilderQuestionsUIList();
            }
        }

        function moveBuilderQuestionDown(index) {
            var currentQ = builderQuestions[index];
            var currentMeta = parseQuestionMetadata(currentQ.name);
            var nextIndex = -1;
            for (var i = index + 1; i < builderQuestions.length; i++) {
                var meta = parseQuestionMetadata(builderQuestions[i].name);
                if (meta.keperluan === currentMeta.keperluan) {
                    nextIndex = i;
                    break;
                }
            }
            if (nextIndex !== -1) {
                var temp = builderQuestions[nextIndex];
                builderQuestions[nextIndex] = builderQuestions[index];
                builderQuestions[index] = temp;
                renderBuilderQuestionsUIList();
            }
        }

        function duplicateBuilderQuestion(index) {
            var q = JSON.parse(JSON.stringify(builderQuestions[index]));
            var meta = parseQuestionMetadata(q.name);
            var newJudul = (meta.judul || meta.cleanName) + " (Copy)";
            q.name = "{" + meta.keperluan + ";;" + newJudul + "} " + meta.cleanName;
            builderQuestions.splice(index + 1, 0, q);
            renderBuilderQuestionsUIList();
        }

        function renderBuilderQuestionsUIList() {
            var container = document.getElementById('builder-q-list');
            if (!container) return;
            container.innerHTML = "";

            if (builderQuestions.length === 0) {
                container.innerHTML = '<p class="text-[10px] text-slate-400 italic font-semibold">Belum ada pertanyaan kustom ditambahkan.</p>';
                return;
            }

            var groupedQ = {};
            builderQuestions.forEach(function (q, idx) {
                var meta = parseQuestionMetadata(q.name);
                if (!groupedQ[meta.keperluan]) groupedQ[meta.keperluan] = [];
                groupedQ[meta.keperluan].push({ data: q, index: idx, meta: meta });
            });

            Object.keys(groupedQ).forEach(function (kep) {
                var groupHtml = '<div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm text-left mb-2">' +
                    '<h5 class="text-[10px] font-extrabold text-blue-600 mb-2 border-b pb-1 flex items-center gap-1.5"><i class="fa-solid fa-list-ul"></i> Keperluan: ' + kep + '</h5>' +
                    '<div class="space-y-1.5 pl-1">';

        function evaluateLiveBuilderSimulatorLogic() {
            var simUploadContainer = document.getElementById('sim-container-uploads');
            if (!simUploadContainer) return;
            simUploadContainer.innerHTML = "";

            var simAnswers = {};
            var qFields = document.querySelectorAll('.sim-question-field');
            qFields.forEach(function (f) {
                simAnswers[f.getAttribute('data-question')] = f.value;
            });

            var activeKeperluan = simAnswers["Keperluan Surat"] || "";

            var simWrappers = document.querySelectorAll('.dynamic-question-wrapper');
            simWrappers.forEach(function (el) {
                var kep = el.getAttribute('data-bind-keperluan');
                if (kep === "Wajib" || (activeKeperluan !== "" && kep === activeKeperluan)) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });

            var activeReqs = [];
            Object.keys(builderReqMap).forEach(function (kep) {
                if (kep === "Wajib" || (activeKeperluan !== "" && kep === activeKeperluan)) {
                    builderReqMap[kep].forEach(function (req) {
                        activeReqs.push("[" + kep + "] " + req);
                    });
                }
            });

            activeReqs.forEach(function (reqFormatted) {
                var cleanName = reqFormatted;
                var match = cleanName.match(/^\[(.*?)\]\s*(.*)$/);
                if (match) cleanName = match[2];

                var card = '<div class="bg-emerald-50 border border-emerald-200 rounded-lg p-2 text-center text-[9px] font-bold text-narmadaGreen">' +
                    '<i class="fa-solid fa-cloud-arrow-up block mb-0.5 text-xs"></i>' + cleanName +
                    '</div>';
                simUploadContainer.innerHTML += card;
            });

            if (simUploadContainer.innerHTML === "") {
                simUploadContainer.innerHTML = '<p class="text-[9px] text-slate-400 italic">Tidak ada berkas yang wajib diupload.</p>';
            }
        }

        function submitBuilderDataToServer() {
            var selectVal = document.getElementById('builder-select-layanan').value;
            var isNew = selectVal === "[+] TAMBAH LAYANAN BARU";
            var name = document.getElementById('builder-layanan-nama').value.trim();

            var selectKeperluan = document.getElementById('builder-keperluan-select');
            var keperluanOpts = [];
            for (var i = 0; i < selectKeperluan.options.length; i++) {
                var val = selectKeperluan.options[i].value;
                if (val && val !== "__ADD_NEW__") {
                    keperluanOpts.push(val);
                }
            }

            var jSec = keperluanOpts.join(",");
            var dSec = "Pilih keperluan pengurusan surat Anda.";

            if (!name) {
                pushToast("Nama pelayanan administrasi surat wajib diisi!", "error");
                return;
            }

            var activeReqs = [];
            Object.keys(builderReqMap).forEach(function (kep) {
                builderReqMap[kep].forEach(function (req) {
                    activeReqs.push("[" + kep + "] " + req);
                });
            });

            var mappedFieldsTextArray = builderQuestions.map(function (q) {
                return JSON.stringify(q);
            });

            var oldName = "";
            if (!isNew && window.loadedLayananList) {
                var found = window.loadedLayananList.find(l => l.nama === selectVal);
                if (found) {
                    payload_id = found.id;
                    oldName = found.nama;
                } else {
                    payload_id = "";
                }
            } else {
                payload_id = "";
            }

            var payload = {
                id: payload_id,
                nama: name,
                namaOld: isNew ? "" : oldName,
                syarat: activeReqs.join(";;;"),
                pertanyaan: mappedFieldsTextArray.join(";;;"),
                judulSectionIsian: jSec,
                deskripsiSectionIsian: dSec,
                logikaKondisional: "[]"
            };

            var action = payload.id ? "update" : "create";

            if (isGoogleEnv) {
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (res.success) {
                            pushToast("Layanan '" + name + "' sukses dipublikasikan ke warga!", "success");
                            resetBuilderFormState();
                            loadBuilderLayananList();
                            loadLayananDataWarga();
                        } else {
                            pushToast("Gagal menyimpan: " + res.message, "error");
                        }
                    })
                    .crudLayanan(action, payload);
            } else {
                if (!payload.id) {
                    dummyLayananList.push({
                        id: "LAY-MOCK-" + Math.random().toString(36).substr(2, 5).toUpperCase(),
                        nama: payload.nama,
                        deskripsi: "Pelayanan baru terdaftar via Service Builder.",
                        judulSectionIsian: payload.judulSectionIsian,
                        deskripsiSectionIsian: payload.deskripsiSectionIsian,
                        logikaKondisional: payload.logikaKondisional,
                        requirements: activeReqs.map(function (r) { return { id: "REQ-" + Math.random(), name: r }; }),
                        fields: builderQuestions
                    });
                } else {
                    var idx = dummyLayananList.findIndex(l => l.id === payload.id);
                    if (idx !== -1) {
                        dummyLayananList[idx].nama = payload.nama;
                        dummyLayananList[idx].judulSectionIsian = payload.judulSectionIsian;
                        dummyLayananList[idx].deskripsiSectionIsian = payload.deskripsiSectionIsian;
                        dummyLayananList[idx].logikaKondisional = payload.logikaKondisional;
                        dummyLayananList[idx].requirements = activeReqs.map(function (r) { return { id: "REQ-" + Math.random(), name: r }; });
                        dummyLayananList[idx].fields = builderQuestions;
                    }
                }
                pushToast("SIMULASI: Sukses mempublikasikan layanan baru.", "success");
                resetBuilderFormState();
                loadBuilderLayananList();
                renderLayananListWarga(dummyLayananList);
            }
        }

                    document.getElementById('setelan-banner-url-desa').value = res.banner_url_desa || "";

                    document.getElementById('setelan-desc-jam').value = res.deskripsi_jam_pelayanan || "";
                    document.getElementById('setelan-desc-alur').value = res.deskripsi_alur || "";
                    document.getElementById('setelan-desc-banner-semi').value = res.deskripsi_banner_semi || "";

                    document.getElementById('setelan-user').value = res.username || "";
                    document.getElementById('setelan-pass').value = res.password || "";

                    document.getElementById('setelan-toggle-jam').checked = (res.status_jam_pelayanan === "on");
                    document.getElementById('setelan-toggle-alur').checked = (res.status_alur === "on");
                    document.getElementById('setelan-toggle-banner').checked = (res.status_banner_semi === "on");
                }).getAdminSetelan();
            } else {
                document.getElementById('setelan-wa').value = dummySetelan.kontak_wa;
                document.getElementById('setelan-nama-desa').value = dummySetelan.nama_desa;
                document.getElementById('setelan-logo-url-desa').value = dummySetelan.logo_url_desa;
                document.getElementById('setelan-deskripsi-banner').value = dummySetelan.deskripsi_banner;
                document.getElementById('setelan-banner-url-desa').value = dummySetelan.banner_url_desa;

                document.getElementById('setelan-desc-jam').value = dummySetelan.deskripsi_jam_pelayanan;
                document.getElementById('setelan-desc-alur').value = dummySetelan.deskripsi_alur;
                document.getElementById('setelan-desc-banner-semi').value = dummySetelan.deskripsi_banner_semi;

                document.getElementById('setelan-user').value = dummySetelan.username;
                document.getElementById('setelan-pass').value = dummySetelan.password;

                document.getElementById('setelan-toggle-jam').checked = (dummySetelan.status_jam_pelayanan === "on");
                document.getElementById('setelan-toggle-alur').checked = (dummySetelan.status_alur === "on");
                document.getElementById('setelan-toggle-banner').checked = (dummySetelan.status_banner_semi === "on");
            }
        }

        function saveAdminSettings() {
            var preWa = document.getElementById('setelan-wa').value.trim();
            var formattedWaAdmin = formatWhatsAppToInternational(preWa);

            var payload = {
                kontak_wa: formattedWaAdmin,
                nama_desa: document.getElementById('setelan-nama-desa').value.trim(),
                logo_url_desa: document.getElementById('setelan-logo-url-desa').value.trim(),
                deskripsi_banner: document.getElementById('setelan-deskripsi-banner').value.trim(),
                banner_url_desa: document.getElementById('setelan-banner-url-desa').value.trim(),

                deskripsi_jam_pelayanan: document.getElementById('setelan-desc-jam').value.trim(),
                deskripsi_alur: document.getElementById('setelan-desc-alur').value.trim(),
                deskripsi_banner_semi: document.getElementById('setelan-desc-banner-semi').value.trim(),

                username: document.getElementById('setelan-user').value.trim(),
                password: document.getElementById('setelan-pass').value.trim(),

                status_jam_pelayanan: document.getElementById('setelan-toggle-jam').checked ? "on" : "off",
                status_alur: document.getElementById('setelan-toggle-alur').checked ? "on" : "off",
                status_banner_semi: document.getElementById('setelan-toggle-banner').checked ? "on" : "off"
            };

            if (isGoogleEnv) {
                google.script.run.withSuccessHandler(function (res) {
                    if (res.success) {
                        pushToast(res.message, "success");
                        loadCMSConfigurationAndLayanan();
                    }
                }).updateAdminSetelan(payload);
            } else {
                dummySetelan = payload;
                globalSettings = payload;
                applyCMSConfigurations(payload);
                pushToast("SIMULASI: Konfigurasi setelan disimpan.", "success");
            }
        }

        function pushToast(message, type) {
            var wrapper = document.getElementById('toast-wrapper');
            if (!wrapper) return;
            var toast = document.createElement('div');

            var bgStyle = type === "success" ? "bg-emerald-950 border-emerald-505/30 text-emerald-200" : "bg-red-950 border-red-505/30 text-red-200";
            if (type === "info") bgStyle = "bg-slate-900 border-slate-700 text-slate-200";

            var icon = "fa-circle-check text-emerald-400";
            if (type === "error") icon = "fa-circle-exclamation text-red-400";
            else if (type === "info") icon = "fa-circle-info text-blue-400";

            toast.className = 'flex items-center space-x-3 p-3 rounded-xl border shadow-2xl transition-all duration-300 transform translate-y-2 opacity-0 text-[11px] font-bold light-glass-card pointer-events-auto w-72 md:w-80 ' + bgStyle;
            toast.innerHTML = '<i class="fa-solid ' + icon + ' text-sm"></i><div class="flex-grow">' + message + '</div>';

            wrapper.appendChild(toast);
            setTimeout(function () { toast.classList.remove('opacity-0', 'translate-y-2'); }, 50);
            setTimeout(function () {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(function () { toast.remove(); }, 300);
            }, 3500);
        }
    </script>
